name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── A: Lint ─────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── B: Type check ───────────────────────────────────────────────────────
      # Runs tsc --noEmit if a tsconfig exists; skips gracefully if not.
      - name: Typecheck
        run: npm run typecheck

      # ── C: Unit tests (Vitest) ──────────────────────────────────────────────
      - name: Test
        run: npm run test:run
        env:
          CI: true

      # ── D: Mirror-sync drift check ──────────────────────────────────────────
      # Fails CI if someone edits src/lib/order-logic.js without touching any
      # handler, or vice versa — surfaces the drift for review.
      - name: Check mirror sync (order-logic drift guard)
        run: npm run check:mirror-sync

      # ── E: Production build ─────────────────────────────────────────────────
      - name: Build
        run: npm run build
        env:
          # Build needs public env vars set even if empty
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY || 'pk_test_placeholder' }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID || 'GTM-PLACEHOLDER' }}