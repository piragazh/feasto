<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / App meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MealDrop" />
    <meta name="theme-color" content="#f97316" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dbbjc1cre/image/upload/v1770322839/final_logo_icon_only_rgoqoy.png" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dbbjc1cre/image/upload/v1770322839/final_logo_icon_only_rgoqoy.png" />

    <!-- Manifest (static, always works) -->
    <link rel="manifest" href="/manifest.json" />

    <title>MealDrop - Food Delivery</title>
  </head>
  <body>
    <script>
      // ── PWA: Capture install prompt BEFORE React mounts ──────────────
      // The beforeinstallprompt event fires very early. We capture it here
      // so React components can access it via window.__pwaInstallPrompt.
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        // Dispatch custom event so React components can react if already mounted
        window.dispatchEvent(new Event('pwaInstallPromptReady'));
      });

      // ── Service Worker Registration ───────────────────────────────────
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[SW] Registered, scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[SW] Registration failed:', err);
            });
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
