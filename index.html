  <body>
    <script>
      // Capture PWA install prompt before React mounts
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new Event('pwaInstallPromptReady'));
      });
      
      // Step 2: Platform domain injection point for custom-domain apps
      // On custom domains, this allows /api calls to route to the platform domain
      // In production, this is auto-injected by the deployment. Leave unset to allow auto-detection.
      // window.__BASE44_PLATFORM_DOMAIN = 'api-production-domain.base44.app';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
