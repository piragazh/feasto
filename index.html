<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dbbjc1cre/image/upload/v1770322839/final_logo_icon_only_rgoqoy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- manifest is injected dynamically by Layout.jsx via /getManifest -->
    <title>MealDrop - Food Delivery from Your Favourite Restaurants</title>
    <meta name="description" content="Order food online from top restaurants in the UK. Fast delivery, great food, amazing offers." />
    <meta property="og:site_name" content="MealDrop" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MealDrop - Food Delivery from Your Favourite Restaurants" />
    <meta property="og:description" content="Order food online from top restaurants in the UK. Fast delivery, great food, amazing offers." />
    <meta property="og:image" content="https://res.cloudinary.com/dbbjc1cre/image/upload/v1767479445/my-project-page-1_qsv0xc.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MealDrop - Food Delivery from Your Favourite Restaurants" />
    <meta name="twitter:description" content="Order food online from top restaurants in the UK. Fast delivery, great food, amazing offers." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dbbjc1cre/image/upload/v1767479445/my-project-page-1_qsv0xc.png" />
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <script>
      // Capture PWA install prompt before React mounts
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new Event('pwaInstallPromptReady'));
      });
      
      // Persist platform/backend origin when Base44 provides it in the URL.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var serverUrl = params.get('server_url');
          if (serverUrl) {
            var origin = new URL(serverUrl).origin;
            sessionStorage.setItem('base44_api_base_url', origin);
            window.__BASE44_PLATFORM_DOMAIN = new URL(serverUrl).host;
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
